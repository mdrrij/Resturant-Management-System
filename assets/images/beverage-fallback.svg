<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="teaBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#221815" />
      <stop offset="100%" stop-color="#0E0807" />
    </radialGradient>
    <linearGradient id="clayCup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C4426" />
      <stop offset="40%" stop-color="#BA6238" />
      <stop offset="70%" stop-color="#D97A4A" />
      <stop offset="100%" stop-color="#6E3118" />
    </linearGradient>
    <linearGradient id="teaSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="50%" stop-color="#C2822B" />
      <stop offset="100%" stop-color="#8C441A" />
    </linearGradient>
    <filter id="teaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#teaBg)" />

  <!-- Wooden Coaster / Saucer -->
  <ellipse cx="300" cy="290" rx="140" ry="40" fill="#1C1410" stroke="#452C1E" stroke-width="2" filter="url(#teaShadow)"/>
  <ellipse cx="300" cy="286" rx="125" ry="32" fill="#2E1D14" stroke="#D4A359" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Clay Kulhad Body -->
  <g filter="url(#teaShadow)">
    <path d="M225,175 L245,280 C245,290 355,290 355,280 L375,175 Z" fill="url(#clayCup)"/>
    <!-- Textured Clay Bands -->
    <path d="M232,210 Q300,225 368,210" stroke="#78341A" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M239,245 Q300,258 361,245" stroke="#78341A" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- Top Rim -->
    <ellipse cx="300" cy="175" rx="75" ry="22" fill="#8C4426" stroke="#BA6238" stroke-width="2"/>
    <!-- Steaming Milk Tea Liquid Level -->
    <ellipse cx="300" cy="177" rx="70" ry="19" fill="url(#teaSurface)"/>
    <!-- Milk Froth Swirl -->
    <path d="M275,176 Q300,183 325,176" stroke="#FEF3C7" stroke-width="2" fill="none" opacity="0.8"/>
    <ellipse cx="295" cy="178" rx="8" ry="4" fill="#FFFBEB" opacity="0.7"/>
  </g>

  <!-- Cinnamon Stick Resting in Cup -->
  <g transform="translate(340, 140) rotate(22)" filter="url(#teaShadow)">
    <rect x="-6" y="-30" width="12" height="85" rx="4" fill="#5A2E12" stroke="#3A1C08" stroke-width="1"/>
    <line x1="-3" y1="-25" x2="-3" y2="50" stroke="#7A421C" stroke-width="1.5"/>
    <ellipse cx="0" cy="-30" rx="6" ry="2.5" fill="#3A1C08"/>
  </g>

  <!-- Whole Himalayan Spices on Coaster -->
  <!-- Star Anise -->
  <g transform="translate(200, 275)" filter="url(#teaShadow)">
    <circle cx="0" cy="0" r="6" fill="#3B1C0B"/>
    <path d="M0,-14 L4,-4 L14,-6 L6,2 L12,12 L2,6 L-4,14 L-4,4 L-14,4 L-6,-2 Z" fill="#582C13"/>
    <circle cx="0" cy="-10" r="1.5" fill="#C2822B"/>
    <circle cx="10" cy="-4" r="1.5" fill="#C2822B"/>
    <circle cx="8" cy="8" r="1.5" fill="#C2822B"/>
  </g>

  <!-- Cardamom Pods -->
  <ellipse cx="395" cy="285" rx="9" ry="5" transform="rotate(-25 395 285)" fill="#65A30D" stroke="#3F6212" stroke-width="1"/>
  <ellipse cx="410" cy="275" rx="8" ry="5" transform="rotate(35 410 275)" fill="#84CC16" stroke="#3F6212" stroke-width="1"/>

  <!-- Delicate Mint Sprig -->
  <path d="M430,270 C445,260 455,270 448,280 C440,285 435,275 430,270 Z" fill="#15803D"/>
  <path d="M430,270 C435,255 450,250 445,262 Z" fill="#22C55E"/>

  <!-- Warm Aromatic Steam Swirls -->
  <path d="M280,145 C270,105 315,75 290,30" stroke="#FFFFFF" stroke-width="3" opacity="0.25" fill="none" stroke-linecap="round"/>
  <path d="M315,135 C335,95 295,65 325,20" stroke="#FFFFFF" stroke-width="2.5" opacity="0.2" fill="none" stroke-linecap="round"/>
  <path d="M260,150 C250,115 280,90 270,55" stroke="#FFFFFF" stroke-width="2" opacity="0.15" fill="none" stroke-linecap="round"/>

  <!-- Badge Label Overlay -->
  <rect x="24" y="24" width="160" height="34" rx="8" fill="rgba(15,20,28,0.85)" stroke="#D4A359" stroke-width="1"/>
  <text x="36" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FDF8EE" letter-spacing="1">MASALA CHIYA</text>
  <circle cx="166" cy="41" r="3" fill="#D4A359" />
</svg>
