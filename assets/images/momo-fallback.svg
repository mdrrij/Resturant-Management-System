<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="momoBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2D201A" />
      <stop offset="100%" stop-color="#140E0C" />
    </radialGradient>
    <linearGradient id="steamerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0A96D" />
      <stop offset="100%" stop-color="#8F5E33" />
    </linearGradient>
    <linearGradient id="momoSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EE" />
      <stop offset="60%" stop-color="#F5E6CF" />
      <stop offset="100%" stop-color="#DFC4A3" />
    </linearGradient>
    <linearGradient id="chiliSauce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D2D" />
      <stop offset="100%" stop-color="#A81C00" />
    </linearGradient>
    <filter id="momoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Dark Atmospheric Background -->
  <rect width="600" height="400" fill="url(#momoBg)" />
  
  <!-- Subtle circular table / slate plate -->
  <circle cx="300" cy="205" r="175" fill="#1C1816" stroke="#3D2E26" stroke-width="3" filter="url(#momoShadow)" />
  <circle cx="300" cy="205" r="160" fill="#25201C" stroke="#4F3C31" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Steamed Bamboo Rim Illusion -->
  <circle cx="300" cy="205" r="148" fill="#1F1A17" stroke="url(#steamerGlow)" stroke-width="2.5" opacity="0.8"/>

  <!-- Central Chili / Timur Achar Bowl -->
  <circle cx="300" cy="205" r="46" fill="#110E0D" stroke="#D4A359" stroke-width="2" />
  <circle cx="300" cy="205" r="38" fill="url(#chiliSauce)" />
  <!-- Sauce Garnish: Roasted Sesame & Cilantro -->
  <circle cx="292" cy="198" r="2" fill="#FFF2D6" />
  <circle cx="308" cy="204" r="2.5" fill="#FFF2D6" />
  <circle cx="300" cy="214" r="2" fill="#FFF2D6" />
  <circle cx="296" cy="208" r="1.5" fill="#10B981" />
  <circle cx="304" cy="195" r="2" fill="#10B981" />

  <!-- Momo 1 (Top) -->
  <g transform="translate(300, 105)" filter="url(#momoShadow)">
    <path d="M-32,15 C-35,-15 35,-15 32,15 C25,28 -25,28 -32,15 Z" fill="url(#momoSkin)" />
    <!-- Pleat Folds -->
    <path d="M-18,-4 Q0,10 0,22 M0,-10 Q0,8 0,22 M18,-4 Q0,10 0,22 M-8,0 Q0,12 0,22 M8,0 Q0,12 0,22" stroke="#B89674" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="3" fill="#D9531E" opacity="0.7"/>
  </g>

  <!-- Momo 2 (Top Right) -->
  <g transform="translate(390, 155) rotate(50)" filter="url(#momoShadow)">
    <path d="M-32,15 C-35,-15 35,-15 32,15 C25,28 -25,28 -32,15 Z" fill="url(#momoSkin)" />
    <path d="M-18,-4 Q0,10 0,22 M0,-10 Q0,8 0,22 M18,-4 Q0,10 0,22" stroke="#B89674" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Momo 3 (Bottom Right) -->
  <g transform="translate(370, 260) rotate(115)" filter="url(#momoShadow)">
    <path d="M-32,15 C-35,-15 35,-15 32,15 C25,28 -25,28 -32,15 Z" fill="url(#momoSkin)" />
    <path d="M-18,-4 Q0,10 0,22 M0,-10 Q0,8 0,22 M18,-4 Q0,10 0,22" stroke="#B89674" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Momo 4 (Bottom Left) -->
  <g transform="translate(240, 265) rotate(205)" filter="url(#momoShadow)">
    <path d="M-32,15 C-35,-15 35,-15 32,15 C25,28 -25,28 -32,15 Z" fill="url(#momoSkin)" />
    <path d="M-18,-4 Q0,10 0,22 M0,-10 Q0,8 0,22 M18,-4 Q0,10 0,22" stroke="#B89674" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Momo 5 (Top Left) -->
  <g transform="translate(210, 160) rotate(290)" filter="url(#momoShadow)">
    <path d="M-32,15 C-35,-15 35,-15 32,15 C25,28 -25,28 -32,15 Z" fill="url(#momoSkin)" />
    <path d="M-18,-4 Q0,10 0,22 M0,-10 Q0,8 0,22 M18,-4 Q0,10 0,22" stroke="#B89674" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Delicate Rising Steam -->
  <path d="M285,90 C280,65 305,50 295,25" stroke="#FFFFFF" stroke-width="2.5" opacity="0.3" fill="none" stroke-linecap="round"/>
  <path d="M315,85 C325,60 305,45 320,20" stroke="#FFFFFF" stroke-width="2" opacity="0.25" fill="none" stroke-linecap="round"/>

  <!-- Badge Label Overlay -->
  <rect x="24" y="24" width="160" height="34" rx="8" fill="rgba(15,20,28,0.85)" stroke="#D9531E" stroke-width="1"/>
  <text x="36" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFF3ED" letter-spacing="1">HIMALAYAN MOMO</text>
  <circle cx="166" cy="41" r="3" fill="#10B981" />
</svg>
